name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # The Telegram bot isn't being used so we just need to give a mock API key
  TELEGRAM_BOT_TOKEN: mock

jobs:
  bot-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bot
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install

      - name: Run unit tests
        run: yarn test
